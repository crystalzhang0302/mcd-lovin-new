name: 每日数据更新

# 北京时间 7:00（早餐时段）与 10:35（正餐时段）各抓取一轮
# cron 用 UTC：23:00 / 02:35
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "35 2 * * *"
  workflow_dispatch: {}   # 允许手动触发测试

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 批量抓取全部城市（单城失败不阻塞）
        run: python fetch_all.py
        continue-on-error: true
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}

      - name: 构建全部城市数据包
        run: |
          python build_all.py
          python build_site.py --pool data/cities/pool_shanghai.json --matrix data/cities/matrix_shanghai.json
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}

      - name: 提交并推送（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(date -u +%F) $([ "$(date -u +%H)" = "23" ] && echo 早餐时段 || echo 正餐时段) (Actions)"
            git push
          fi
